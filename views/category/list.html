<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.13/lib/theme-chalk/index.css">
    <style>
        .container {
            padding: 20px;
        }
        .header {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <el-row type="flex" justify="space-between">
                    <el-col :span="12">
                        <h2>分类管理</h2>
                    </el-col>
                    <el-col :span="12" style="text-align: right">
                        <el-button type="primary" @click="showAddDialog">新增分类</el-button>
                    </el-col>
                </el-row>
            </div>

            <el-table :data="tableData" border style="width: 100%">
                <el-table-column prop="name" label="分类名称"></el-table-column>
                <el-table-column label="操作" width="200">
                    <template slot-scope="scope">
                        <el-button size="mini" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button size="mini" type="danger" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 新增/编辑对话框 -->
            <el-dialog :title="dialogTitle" :visible.sync="dialogVisible">
                <el-form :model="form" ref="form" :rules="rules" label-width="100px">
                    <el-form-item label="分类名称" prop="name">
                        <el-input v-model="form.name"></el-input>
                    </el-form-item>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button @click="dialogVisible = false">取 消</el-button>
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                </div>
            </el-dialog>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.13/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    tableData: [],
                    dialogVisible: false,
                    dialogTitle: '新增分类',
                    form: {
                        name: ''
                    },
                    rules: {
                        name: [{ required: true, message: '请输入分类名称', trigger: 'blur' }]
                    }
                }
            },
            created() {
                this.fetchData()
            },
            methods: {
                async fetchData() {
                    try {
                        const res = await axios.get('/api/category/list')
                        this.tableData = res.data
                    } catch (error) {
                        this.$message.error('获取数据失败')
                    }
                },
                showAddDialog() {
                    this.dialogTitle = '新增分类'
                    this.form = { name: '' }
                    this.dialogVisible = true
                },
                handleEdit(row) {
                    this.dialogTitle = '编辑分类'
                    this.form = { ...row }
                    this.dialogVisible = true
                },
                async handleDelete(row) {
                    try {
                        await this.$confirm('确认删除该分类?', '提示', {
                            type: 'warning'
                        })
                        await axios.delete(`/api/category/${row._id}`)
                        this.$message.success('删除成功')
                        this.fetchData()
                    } catch (error) {
                        if (error !== 'cancel') {
                            this.$message.error('删除失败')
                        }
                    }
                },
                async submitForm() {
                    try {
                        await this.$refs.form.validate()
                        if (this.form._id) {
                            await axios.put(`/api/category/${this.form._id}`, this.form)
                        } else {
                            await axios.post('/api/category', this.form)
                        }
                        this.$message.success(this.form._id ? '更新成功' : '添加成功')
                        this.dialogVisible = false
                        this.fetchData()
                    } catch (error) {
                        if (error !== false) {
                            this.$message.error(this.form._id ? '更新失败' : '添加失败')
                        }
                    }
                }
            }
        })
    </script>
</body>
</html>
