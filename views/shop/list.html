<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.13/lib/theme-chalk/index.css">
    <style>
        .container {
            padding: 20px;
        }
        .header {
            margin-bottom: 20px;
        }
        .search-form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <el-row type="flex" justify="space-between">
                    <el-col :span="12">
                        <h2>商品管理</h2>
                    </el-col>
                    <el-col :span="12" style="text-align: right">
                        <el-button type="primary" @click="showAddDialog">新增商品</el-button>
                    </el-col>
                </el-row>
            </div>

            <div class="search-form">
                <el-form :inline="true" :model="searchForm" ref="searchForm">
                    <el-form-item label="商品名称">
                        <el-input v-model="searchForm.name" placeholder="请输入商品名称"></el-input>
                    </el-form-item>
                    <el-form-item label="商品分类">
                        <el-select v-model="searchForm.cate" placeholder="请选择分类">
                            <el-option v-for="item in categories" :key="item._id" :label="item.name" :value="item._id">
                            </el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="handleSearch">搜索</el-button>
                        <el-button @click="resetSearch">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <el-table :data="tableData" border style="width: 100%">
                <el-table-column prop="name" label="商品名称"></el-table-column>
                <el-table-column prop="price" label="价格"></el-table-column>
                <el-table-column prop="number" label="库存"></el-table-column>
                <el-table-column prop="cate.name" label="分类"></el-table-column>
                <el-table-column prop="description.name" label="标签"></el-table-column>
                <el-table-column prop="status" label="状态"></el-table-column>
                <el-table-column label="操作" width="200">
                    <template slot-scope="scope">
                        <el-button size="mini" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button size="mini" type="danger" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <div class="pagination" style="margin-top: 20px; text-align: right;">
                <el-pagination
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-size="pageSize"
                    layout="total, prev, pager, next"
                    :total="total">
                </el-pagination>
            </div>

            <!-- 新增/编辑对话框 -->
            <el-dialog :title="dialogTitle" :visible.sync="dialogVisible">
                <el-form :model="form" ref="form" :rules="rules" label-width="100px">
                    <el-form-item label="商品名称" prop="name">
                        <el-input v-model="form.name"></el-input>
                    </el-form-item>
                    <el-form-item label="价格" prop="price">
                        <el-input-number v-model="form.price" :precision="2" :step="0.1" :min="0"></el-input-number>
                    </el-form-item>
                    <el-form-item label="库存" prop="number">
                        <el-input-number v-model="form.number" :min="0"></el-input-number>
                    </el-form-item>
                    <el-form-item label="分类" prop="cate">
                        <el-select v-model="form.cate" placeholder="请选择分类">
                            <el-option v-for="item in categories" :key="item._id" :label="item.name" :value="item._id">
                            </el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="标签" prop="description">
                        <el-select v-model="form.description" placeholder="请选择标签">
                            <el-option v-for="item in descriptions" :key="item._id" :label="item.name" :value="item._id">
                            </el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="状态" prop="status">
                        <el-select v-model="form.status" placeholder="请选择状态">
                            <el-option label="上架" value="上架"></el-option>
                            <el-option label="下架" value="下架"></el-option>
                        </el-select>
                    </el-form-item>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button @click="dialogVisible = false">取 消</el-button>
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                </div>
            </el-dialog>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.13/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    searchForm: {
                        name: '',
                        cate: ''
                    },
                    tableData: [],
                    categories: [],
                    descriptions: [],
                    currentPage: 1,
                    pageSize: 10,
                    total: 0,
                    dialogVisible: false,
                    dialogTitle: '新增商品',
                    form: {
                        name: '',
                        price: 0,
                        number: 0,
                        cate: '',
                        description: '',
                        status: '上架'
                    },
                    rules: {
                        name: [{ required: true, message: '请输入商品名称', trigger: 'blur' }],
                        price: [{ required: true, message: '请输入价格', trigger: 'blur' }],
                        number: [{ required: true, message: '请输入库存数量', trigger: 'blur' }],
                        cate: [{ required: true, message: '请选择分类', trigger: 'change' }],
                        description: [{ required: true, message: '请选择标签', trigger: 'change' }],
                        status: [{ required: true, message: '请选择状态', trigger: 'change' }]
                    }
                }
            },
            created() {
                this.fetchData()
                this.fetchCategories()
                this.fetchDescriptions()
            },
            methods: {
                async fetchData() {
                    try {
                        const res = await axios.get('/api/shop/list', {
                            params: {
                                page: this.currentPage,
                                pageSize: this.pageSize,
                                ...this.searchForm
                            }
                        })
                        this.tableData = res.data.data
                        this.total = res.data.total
                    } catch (error) {
                        this.$message.error('获取数据失败')
                    }
                },
                async fetchCategories() {
                    try {
                        const res = await axios.get('/api/category/list')
                        this.categories = res.data
                    } catch (error) {
                        this.$message.error('获取分类失败')
                    }
                },
                async fetchDescriptions() {
                    try {
                        const res = await axios.get('/api/description/list')
                        this.descriptions = res.data
                    } catch (error) {
                        this.$message.error('获取标签失败')
                    }
                },
                handleSearch() {
                    this.currentPage = 1
                    this.fetchData()
                },
                resetSearch() {
                    this.$refs.searchForm.resetFields()
                    this.handleSearch()
                },
                handleCurrentChange(val) {
                    this.currentPage = val
                    this.fetchData()
                },
                showAddDialog() {
                    this.dialogTitle = '新增商品'
                    this.form = {
                        name: '',
                        price: 0,
                        number: 0,
                        cate: '',
                        description: '',
                        status: '上架'
                    }
                    this.dialogVisible = true
                },
                handleEdit(row) {
                    this.dialogTitle = '编辑商品'
                    this.form = { ...row }
                    this.dialogVisible = true
                },
                async handleDelete(row) {
                    try {
                        await this.$confirm('确认删除该商品?', '提示', {
                            type: 'warning'
                        })
                        await axios.delete(`/api/shop/${row._id}`)
                        this.$message.success('删除成功')
                        this.fetchData()
                    } catch (error) {
                        if (error !== 'cancel') {
                            this.$message.error('删除失败')
                        }
                    }
                },
                async submitForm() {
                    try {
                        await this.$refs.form.validate()
                        if (this.form._id) {
                            await axios.put(`/api/shop/${this.form._id}`, this.form)
                        } else {
                            await axios.post('/api/shop', this.form)
                        }
                        this.$message.success(this.form._id ? '更新成功' : '添加成功')
                        this.dialogVisible = false
                        this.fetchData()
                    } catch (error) {
                        if (error !== false) {
                            this.$message.error(this.form._id ? '更新失败' : '添加失败')
                        }
                    }
                }
            }
        })
    </script>
</body>
</html>
